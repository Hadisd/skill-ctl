<svg xmlns="http://www.w3.org/2000/svg" width="620" height="180" viewBox="0 0 620 180" role="img" aria-label="skill-ctl">
  <!-- Generated from skill_ctl.mark (Corvo the Skill Raven).
       Shares the exact 24x22 coordinate matrix with the ANSI terminal banner. -->
  <style>
    .breathe { transform-origin: 96px 150px; }
    .crystal-glow { transform-origin: 96px 105px; }
    .eye-glance { transform-origin: 90px 45px; }
    
    @media (prefers-reduced-motion: no-preference) {
      .breathe { animation: raven-breathe 4.8s cubic-bezier(.4,0,.5,1) infinite; }
      .crystal-glow { animation: crystal-pulse 3.2s ease-in-out infinite; }
      .eye-glance { animation: eye-pulse 6.4s ease-in-out infinite; }
    }
    
    @keyframes raven-breathe {
      0%, 100% { transform: scale(1, 1); }
      45%, 55% { transform: scale(0.985, 1.025); }
    }
    
    @keyframes crystal-pulse {
      0%, 100% { filter: drop-shadow(0 0 2px #38bdf8); opacity: 0.9; }
      50% { filter: drop-shadow(0 0 8px #38bdf8); opacity: 1; }
    }
    
    @keyframes eye-pulse {
      0%, 40%, 60%, 100% { opacity: 1; }
      48%, 52% { opacity: 0.2; }
    }
    
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace; font-size: 32px; font-weight: 800; fill: #38bdf8; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace; font-size: 13px; font-weight: 600; fill: #64748b; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace; font-size: 15px; font-style: italic; fill: #94A3B8; }
    .detail { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace; font-size: 13px; fill: #64748b; }
    .keyword { font-weight: 600; fill: #38bdf8; }
    .active { font-weight: 600; fill: #10b981; }
  </style>

  <!-- Mascot (Corvo the Skill Raven) -->
